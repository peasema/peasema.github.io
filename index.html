<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>每日資訊早晚報</title>
  <meta name="description" content="平日早晚四方一頁式彙整：國際、社群、天象、股市。">
  <meta name="theme-color" content="#f4f1ea" id="themeColor">
  <meta name="apple-mobile-web-app-title" content="每日資訊早晚報">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+TC:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="assets/css/app.css?v=20261126g">
  <script>
    (function () {
      var theme = "light";
      try {
        var saved = localStorage.getItem("brief-theme");
        if (saved === "light" || saved === "dark") theme = saved;
        else if (window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
      } catch (err) {
        theme = "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
      var meta = document.getElementById("themeColor");
      if (meta) meta.setAttribute("content", theme === "dark" ? "#12110e" : "#f4f1ea");
    })();
  </script>
</head>
<body>
  <div class="progress" id="progress" aria-hidden="true"></div>
  <a class="skip" href="#content">跳至內文</a>
  <header class="topbar" id="topbar">
    <div class="wrap topbar-inner">
      <div class="brand-row">
        <div class="brand-lockup">
          <span class="brand-dots" aria-hidden="true">
            <i class="dot-world"></i>
            <i class="dot-social"></i>
            <i class="dot-astro"></i>
            <i class="dot-market"></i>
          </span>
          <div class="brand-text">
            <a class="brand" href="./"><h1>每日資訊早晚報</h1></a>
            <time id="updatedAt"></time>
          </div>
        </div>
        <button type="button" class="ghost" id="themeToggle" aria-pressed="false">深色</button>
      </div>
      <div class="controls-row">
        <div class="selectors">
          <label class="field">
            <span class="field-label">日期</span>
            <select id="dateSelect" aria-label="日期"></select>
          </label>
          <div class="session-switch" id="sessionSwitch" role="group" aria-label="時段"></div>
          <button type="button" class="ghost" id="archiveOpen">歷程</button>
        </div>
        <label class="search">
          <span class="visually-hidden">搜尋關鍵字</span>
          <input id="searchInput" type="search" placeholder="搜尋關鍵字" autocomplete="off" enterkeyhint="search">
        </label>
      </div>
      <div class="jump-row">
        <nav class="jumps" id="jumps" aria-label="快速前往">
          <a class="jump jump-world" href="#domain-world" data-target="domain-world">國際</a>
          <a class="jump jump-social" href="#domain-social" data-target="domain-social">社群</a>
          <a class="jump jump-astro" href="#domain-astro" data-target="domain-astro">天象</a>
          <a class="jump jump-market" href="#domain-market" data-target="domain-market">股市</a>
          <a class="jump jump-review" href="#review" data-target="review">檢討</a>
        </nav>
        <button type="button" class="ghost" id="toggleDetails" aria-expanded="false">全部展開</button>
      </div>
    </div>
  </header>
  <main class="wrap" id="content">
    <p id="searchStatus" class="search-status" role="status" hidden></p>
    <div id="app" class="loading" aria-busy="true">載入中…</div>
  </main>
  <footer class="colophon">
    <div class="wrap">
      <p>本頁彙整各單位當日存檔，僅供參考，不構成投資建議。</p>
    </div>
  </footer>
  <dialog id="archiveDialog" aria-labelledby="archiveTitle">
    <div class="archive-card">
      <div class="archive-head">
        <h2 id="archiveTitle">歷程</h2>
        <button type="button" class="ghost" id="archiveClose">關閉</button>
      </div>
      <div id="archiveList"></div>
    </div>
  </dialog>
  <noscript><p>需要啟用 JavaScript 才能載入 data/briefs.json。</p></noscript>
  <script type="module" src="assets/js/app.js?v=20261126g"></script>
</body>
</html>
